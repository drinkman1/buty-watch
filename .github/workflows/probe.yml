name: probe
on: workflow_dispatch
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: curl warianty
        run: |
          U="https://jdsports.pl/meskie/buty/sneakersy/nike-air-max-90-szary-do6706-002"
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/141.0.0.0 Safari/537.36"
          for v in "--http1.1" "--http2"; do
            curl -s $v -A "$UA" -H "Accept-Language: pl-PL,pl" -H "Accept: text/html" -o /tmp/p.html -w "$v %{http_code} %{size_download} %{time_total}s\n" --max-time 40 "$U" || echo "$v fail"
            grep -c "offers%22%3A%5B%7B%22label" /tmp/p.html || true
          done
      - name: chrome headless
        run: |
          timeout 60 google-chrome --headless=new --disable-gpu --no-sandbox --dump-dom "https://jdsports.pl/meskie/buty/sneakersy/nike-air-max-90-szary-do6706-002" > /tmp/c.html 2>/dev/null; echo "exit $? size $(wc -c < /tmp/c.html)"
          grep -c "variant-size-item" /tmp/c.html || true
          grep -o "<title>[^<]*" /tmp/c.html | head -1
