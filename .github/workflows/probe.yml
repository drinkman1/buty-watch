name: probe
on: workflow_dispatch
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: |
          cat > p.mjs <<'JS'
          const UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/141.0.0.0 Safari/537.36';
          const urls={
            zal:'https://www.zalando.pl/nike-sportswear-air-max-90-prm-trk3-unisex-sneakersy-niskie-flaxwheatlight-brown-ni115o05t-o11.html',
            zsearch:'https://www.zalando.pl/katalog/?q=DO6706-002',
            lounge:'https://www.zalando-lounge.pl/nike-outlet/',
            pepper:'https://www.pepper.pl/search?q=air+max+90',
            jd:'https://jdsports.pl/meskie/buty/sneakersy/nike-air-max-90-szary-do6706-002'};
          for (const [k,u] of Object.entries(urls)) { const t0=Date.now(); try { const r=await fetch(u,{headers:{'User-Agent':UA,'Accept-Language':'pl-PL'},signal:AbortSignal.timeout(20000)}); const t=await r.text(); console.log(k,r.status,t.length,Date.now()-t0+'ms',(t.match(/<title>[^<]*/)||[''])[0].slice(0,70), 'ld:'+t.includes('NI115O05T-O110095000'), 'pep:'+t.includes('ThreadMainListItemNormalizer'), 'lounge:'+t.includes('"campaigns":[')); } catch(e){console.log(k,'ERR',e.message)} }
          JS
          node p.mjs
